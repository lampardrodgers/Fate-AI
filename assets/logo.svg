<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 680 210" width="1360" height="420">
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&amp;display=swap');</style>
<rect x="-20" y="-20" width="680" height="210" fill="#07080d"/>
<defs>
    <linearGradient id="lgGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#e8c77a"/><stop offset=".55" stop-color="#b98b3a"/><stop offset="1" stop-color="#6b4a18"/>
    </linearGradient>
    <linearGradient id="lgRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a98"/><stop offset=".5" stop-color="#d0142f"/><stop offset="1" stop-color="#5a0010"/>
    </linearGradient>
    <linearGradient id="lgBlade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5a0010"/><stop offset=".35" stop-color="#ff2d47"/><stop offset=".8" stop-color="#ffd0d6"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <filter id="lgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

    <g font-family="'Cinzel Decorative','Cinzel','Trajan Pro',serif" font-weight="700">
      <text x="4" y="124" font-size="124" textLength="356" lengthAdjust="spacingAndGlyphs" fill="url(#lgGold)" stroke="#3a2608" stroke-width="1">FATE</text>
      <text x="468" y="124" font-size="124" textLength="164" lengthAdjust="spacingAndGlyphs" fill="url(#lgRed)" stroke="#2a0008" stroke-width="1">AI</text>
    </g>
    <!-- the slash: a crimson blade -->
    <g filter="url(#lgGlow)">
      <polygon points="378,168 405,128 463,3 396,123" fill="url(#lgBlade)"/>
      <line x1="384" y1="158" x2="458" y2="12" stroke="#fff" stroke-width="1.1" stroke-linecap="round" opacity=".75"/>
    </g>
    <line x1="4" y1="146" x2="350" y2="146" stroke="#c9a961" stroke-width="1.2" opacity=".7"/>
    <line x1="470" y1="146" x2="632" y2="146" stroke="#c9a961" stroke-width="1.2" opacity=".7"/>
  
</svg>