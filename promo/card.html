<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FATE/AI promo card</title>
<!-- Renders one 1920×1080 frame of the promo video.
     ?scene=char&i=0..9&layer=bg|fg   ·   ?scene=epi|logo|outro&layer=bg|fg
     fg layers are rendered on a transparent background and animated in ffmpeg. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Noto+Serif+SC:wght@400;600;900&family=EB+Garamond:ital,wght@0,400;1,400&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:"Noto Serif SC",serif;color:#e9e4d8;position:relative}
.bg{position:absolute;inset:0;background:#06070b;overflow:hidden}
.sky{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 70% at 75% 45%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%),
  radial-gradient(ellipse 70% 60% at 50% -10%,rgba(60,70,140,.35),transparent 60%),
  radial-gradient(ellipse 60% 50% at 0% 100%,rgba(120,10,30,.25),transparent 60%),
  linear-gradient(#07080d,#0a0b12 40%,#07080d)}
.circle{position:absolute;width:1300px;height:1300px;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.22}
.circle.right{left:73%}
.portrait{position:absolute;right:0;top:0;width:1180px;height:1080px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 92%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 92%,transparent 100%)}
.portrait img{width:100%;height:auto;display:block;margin-top:-6px}
.water{position:absolute;left:60px;bottom:-40px;font-family:"Cinzel",serif;font-weight:900;font-size:300px;line-height:1;letter-spacing:.02em;
  color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--c) 45%,transparent);opacity:.55;white-space:nowrap}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 85% at 50% 50%,transparent 55%,rgba(0,0,0,.75));pointer-events:none}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:46px;background:#000;z-index:5}
.bars::before{top:0}.bars::after{bottom:0}

/* ---------- character foreground ---------- */
.fg{position:absolute;left:140px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center;gap:0}
.tag{display:flex;gap:14px;align-items:center;font-family:"Cinzel",serif;font-size:22px;letter-spacing:.25em;color:var(--c2)}
.tag b{font-family:"Noto Serif SC";font-weight:600;font-size:18px;letter-spacing:.2em;padding:5px 12px;background:var(--c);color:#0b0b10}
.tag span{border:1px solid color-mix(in srgb,var(--c) 70%,transparent);padding:5px 14px}
.clscn{margin-top:34px;font-size:30px;letter-spacing:.5em;color:#bdb6a6}
.cls{font-family:"Cinzel",serif;font-weight:900;font-size:112px;line-height:1;letter-spacing:.04em;margin-top:6px;
  background:linear-gradient(180deg,#fff 10%,var(--c2) 45%,var(--c) 100%);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px color-mix(in srgb,var(--c) 55%,transparent))}
.name{margin-top:26px;font-size:64px;font-weight:900;line-height:1.15;color:#fff;letter-spacing:.04em;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.name .x{color:#ff3b52;font-weight:400;margin:0 .25em;font-size:.7em;vertical-align:.12em}
.name .m{color:#f1dca0;font-size:.62em;font-weight:600}
.rule{margin:38px 0 30px;width:520px;height:1px;background:linear-gradient(90deg,var(--c),transparent)}
.np .lbl{font-family:"Cinzel",serif;font-size:18px;letter-spacing:.4em;color:#ff3b52}
.np .n{margin-top:10px;font-size:40px;font-weight:900;color:#fff;letter-spacing:.06em}
.np .en{margin-top:4px;font-family:"EB Garamond",serif;font-style:italic;font-size:30px;color:var(--c2)}
.line{margin-top:34px;font-size:28px;line-height:1.6;color:#d8d2c4;max-width:820px}
.line b{color:var(--c2);font-weight:900}
.cls.long{font-size:84px;white-space:nowrap}
.line::before{content:"「";color:var(--c)}.line::after{content:"」";color:var(--c)}

/* ---------- title scenes ---------- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.epi p{font-size:46px;line-height:2.1;letter-spacing:.14em;color:#e9e4d8;text-shadow:0 0 30px rgba(0,0,0,.9)}
.epi em{font-style:normal;color:#ff3b52;font-family:"Cinzel",serif;font-weight:700}
.eyebrow{font-family:"Cinzel",serif;letter-spacing:.6em;font-size:22px;color:#c9a961;margin-bottom:30px}
.logo svg{width:1180px;height:auto;filter:drop-shadow(0 0 40px rgba(179,18,43,.35))}
.logo h2{margin-top:30px;font-size:52px;font-weight:900;letter-spacing:.32em;color:#f1dca0}
.logo h3{margin-top:18px;font-family:"Cinzel",serif;font-weight:400;font-size:22px;letter-spacing:.55em;color:#9a958a}
.outro .cta{margin-top:56px;font-size:34px;letter-spacing:.4em;color:#e9e4d8}
.outro .url{margin-top:22px;font-family:"Cinzel",serif;font-weight:700;font-size:54px;letter-spacing:.18em;color:#ff3b52;
  padding:10px 40px;border-top:1px solid rgba(201,169,97,.5);border-bottom:1px solid rgba(201,169,97,.5)}
.outro .langs{margin-top:26px;font-size:22px;letter-spacing:.4em;color:#9a958a}
</style>
</head>
<body>
<script src="data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const scene = q.get('scene')||'char', layer = q.get('layer')||'bg', i = +(q.get('i')||0);
const d = window.PROMO[i];
const CIRCLE = `<svg viewBox="0 0 200 200" fill="none" stroke="#c9a961" stroke-width=".35">
  <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="90" stroke-dasharray="1 2"/><circle cx="100" cy="100" r="62"/>
  <polygon points="100,10 178,145 22,145"/><polygon points="100,190 22,55 178,55"/><circle cx="100" cy="100" r="38" stroke-dasharray="3 2"/></svg>`;
let html = '';
if(layer === 'bg'){
  if(scene === 'char'){
    document.body.style.setProperty('--c', d.c); document.body.style.setProperty('--c2', d.c2);
    html = `<div class="bg bars"><div class="sky"></div><div class="circle right">${CIRCLE}</div>
      <div class="water">${d.cls.toUpperCase()}</div>
      <div class="portrait"><img src="../纯立绘/${d.img}"></div><div class="vig"></div></div>`;
  } else {
    document.body.style.setProperty('--c', '#b3122b');
    html = `<div class="bg bars"><div class="sky"></div><div class="circle">${CIRCLE}</div><div class="vig"></div></div>`;
  }
} else {
  if(scene === 'char'){
    document.body.style.setProperty('--c', d.c); document.body.style.setProperty('--c2', d.c2);
    html = `<div class="fg">
      <div class="tag"><b>${d.tier}</b><span>No.${d.no} · ${d.cls.toUpperCase()}</span></div>
      <div class="clscn">${d.clsCn}</div>
      <div class="cls${d.cls.length>9?' long':''}">${d.cls}</div>
      <div class="name">${d.servant}<span class="x">×</span><span class="m">${d.master}</span></div>
      <div class="rule"></div>
      ${d.np?`<div class="np"><div class="lbl">NOBLE PHANTASM</div><div class="n">${d.np[0]}</div><div class="en">${d.np[1]}</div></div>`:''}
      <div class="line">${d.line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</div></div>`;
  } else if(scene === 'epi'){
    html = `<div class="center epi"><div class="eyebrow">TYPE-MOON · ARTIFICIAL INTELLIGENCE</div>
      <p>七骑英灵，为一尊名为 <em>AGI</em> 的圣杯在冬木市厮杀。<br>裁定者在暗处掀桌，人类恶自天外降临，<br>而宝石翁只是微笑着——向每一方出售魔力。</p></div>`;
  } else if(scene === 'logo'){
    html = `<div class="center logo"><div class="eyebrow">TYPE-MOON · ARTIFICIAL INTELLIGENCE</div><div id="lg"></div>
      <h2>型月 AI 圣杯战争</h2><h3>THE HOLY GRAIL WAR OF AGI — COMPLETE MATERIAL</h3></div>`;
  } else if(scene === 'outro'){
    html = `<div class="center logo outro"><div id="lg"></div><h2>完全体设定集 · 现已公开</h2>
      <div class="url">FATE.EMMM.SI</div><div class="langs">中文 · ENGLISH · 日本語</div></div>`;
  }
}
document.body.innerHTML += html;
const lg = document.getElementById('lg');
if(lg) fetch('../assets/logo.svg').then(r=>r.text()).then(t=>{
  lg.innerHTML = t.replace(/<\?xml[^>]*>/,'');
  const bgRect = lg.querySelector('svg > rect'); if(bgRect) bgRect.remove();   // drop the dark backdrop
});
</script>
</body>
</html>
